[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { name = "Aliaksei Chapyzhenka" }, { name = "Masoud Ebrahimi" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "VCD and compact VCD grammar for tree-sitter (fork of wavedrom/tree-sitter-vcd)"
keywords = [ "incremental", "parsing", "tree-sitter", "vcd", "waveform" ]
license.text = "MIT"
name = "tree-sitter-vcd"
readme = "README.md"
requires-python = ">=3.10"
version = "0.2.0"

[project.optional-dependencies]
core = [ "tree-sitter>=0.25" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
